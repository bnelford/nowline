<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NowLine — live conference timeline</title>
<style>
:root{
  --bg:#0e1116;--panel:#161a22;--panel2:#1d2330;--line:#2a3140;--text:#e8ecf3;--dim:#8a93a6;--faint:#566074;
  --now:#ff4d5e;--accent:#7cc4ff;--star:#ffc94d;
  --label:104px;--lane:62px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand span{color:var(--now)}
.conf{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:4px 8px;border-radius:8px;background:var(--panel2)}
.clock.sim{background:#3a2a10;color:var(--star)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn.on{background:var(--accent);color:#06121e;border-color:var(--accent);font-weight:600}
.btn.live.on{background:var(--now);border-color:var(--now);color:#fff}
.icon{padding:6px 9px}

/* NOW / NEXT strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:210px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;cursor:pointer}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.card .k b{color:var(--now)}
.card .t{font-weight:600;margin:3px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--dim)}
.card .go{font-size:12px;margin-top:3px;color:var(--star)}
.card .bar{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--now)}
.empty{color:var(--faint);padding:10px 2px;font-size:13px}

/* controls */
.controls{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.sel{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 4px 0 10px;white-space:nowrap}
.sel small{color:var(--dim)}
.sel select{background:transparent;border:0;padding:6px 4px;outline:none}
.sel option{background:var(--panel)}

/* timeline */
.tl{flex:1;min-height:0;overflow:auto;position:relative;border-top:1px solid var(--line);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.inner{position:relative}
.ruler{position:sticky;top:0;z-index:6;display:flex;height:28px;background:var(--bg);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;width:var(--label);flex:0 0 var(--label);background:var(--bg);border-right:1px solid var(--line);font-size:11px;color:var(--dim);display:flex;align-items:center;padding-left:10px}
.ticks{position:relative;flex:0 0 auto}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--dim);padding:7px 0 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.half{border-left-style:dashed;border-color:#20262f}
.tick.half span{display:none}
.lane{display:flex;height:var(--lane);border-bottom:1px solid #1a1f29}
.lane.far{opacity:.33}
.lab{position:sticky;left:0;z-index:5;width:var(--label);flex:0 0 var(--label);background:var(--panel);border-right:1px solid var(--line);padding:7px 8px 6px 10px;border-left:4px solid var(--c);cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.lab b{font-size:12.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lab small{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;flex:0 0 auto;background-image:linear-gradient(to right,#1a1f29 1px,transparent 1px)}
.s{position:absolute;top:5px;bottom:5px;border-radius:8px;padding:5px 7px;overflow:hidden;cursor:pointer;background:var(--panel2);border:1px solid var(--line);background:color-mix(in srgb,var(--c) 22%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);transition:opacity .2s}
.s .t{font-size:12px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s .m{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.s.past{opacity:.38;filter:saturate(.4)}
.s.live{border-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
.s .prog{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--now) 16%,transparent);pointer-events:none}
.s .t,.s .m{position:relative}
.s.star::after{content:"★";position:absolute;right:5px;top:3px;color:var(--star);font-size:12px}
.pastshade{position:absolute;top:28px;bottom:0;background:rgba(0,0,0,.18);pointer-events:none;z-index:1}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:4;pointer-events:none;box-shadow:0 0 10px var(--now)}
.nowline .tag{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:var(--now);color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nowline .dot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--now)}
.follow{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:var(--now);color:#fff;border:0;border-radius:999px;padding:10px 14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;cursor:pointer}
.follow.show{display:block}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-top-left-radius:16px;border-top-right-radius:16px;border-top:1px solid var(--line);max-height:82vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease}
.sheet.show{transform:none}
.sheet h2{margin:2px 0 6px;font-size:18px;line-height:1.25}
.sheet h3{margin:14px 0 6px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.sheet p{margin:6px 0;color:#c9d0dc}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--panel2);margin:2px 4px 2px 0;color:var(--dim)}
.pill.c{color:#06121e;background:var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.off{opacity:.4;text-decoration:line-through}
textarea{width:100%;min-height:150px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.note{font-size:12px;color:var(--dim)}
.err{color:var(--now);font-size:13px;margin-top:6px}
label.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px}

/* personal agenda */
.lane.me{background:linear-gradient(to bottom,#1b1810,#14120d);border-bottom:2px solid #3a3220}
.lane.me .lab{background:#221d10;--c:var(--star)}
.lane.me .lab b{color:var(--star)}
.b{position:absolute;border-radius:8px;padding:4px 7px;overflow:hidden;cursor:pointer;background:#3a2f12;border:1px solid var(--star);color:#ffe7a8}
.b .t{font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.b .m{font-size:10.5px;color:#d9c48a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.b.past{opacity:.38}
.b.live{box-shadow:0 0 0 1px var(--now) inset;border-color:var(--now)}
.b .prog{position:absolute;left:0;top:0;bottom:0;background:rgba(255,77,94,.16);pointer-events:none}
.lane.me .s{border-style:dashed}
.walk{position:absolute;bottom:3px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#8a93a6 0 4px,transparent 4px 7px);opacity:.7;pointer-events:none}
.walk.bad{background:repeating-linear-gradient(90deg,var(--now) 0 4px,transparent 4px 7px);opacity:1}
.cf{position:absolute;top:2px;z-index:3;transform:translateX(-50%);background:var(--now);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;white-space:nowrap;pointer-events:none}
.ovl{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,77,94,.28) 0 6px,transparent 6px 12px);pointer-events:none;z-index:2}
.pb{position:absolute;bottom:1px;height:13px;border-radius:4px;background:repeating-linear-gradient(135deg,#3a2f12 0 6px,#2a220d 6px 12px);border:1px solid var(--star);color:#ffe7a8;font-size:9.5px;line-height:11px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:2}
.track{cursor:copy}
.card.warn{border-color:var(--now);border-left-color:var(--now);background:#241318}
.card.warn .k{color:#ff9aa4}
.card.mine{border-left-color:var(--star)}
.form{display:grid;gap:10px;margin-top:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--dim)}
.form input,.form select,.form textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:15px;min-height:0}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warnbox{background:#241318;border:1px solid var(--now);border-radius:10px;padding:8px 10px;font-size:13px;color:#ffc7cc;margin-top:8px}
.okbox{background:#12241a;border:1px solid #2f6b47;border-radius:10px;padding:8px 10px;font-size:13px;color:#a8e6c0;margin-top:8px}

/* map view */
.viewsw{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px}
.viewsw button{border:0;background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.viewsw button.on{background:var(--text);color:var(--bg);font-weight:700}
.mapwrap{flex:1;min-height:0;display:none;flex-direction:column;border-top:1px solid var(--line)}
body.mapmode .mapwrap{display:flex}
body.mapmode .tl{display:none}
body.mapmode .follow{display:none!important}
.mapbox{position:relative;flex:1;min-height:200px;overflow:hidden;background:#0b0e13;touch-action:none}
.mapbox svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl .btn{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(29,35,48,.92)}
.maphint{position:absolute;left:10px;top:10px;right:60px;font-size:12px;color:var(--dim);background:rgba(14,17,22,.85);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.maplist{max-height:34%;overflow:auto;border-top:1px solid var(--line);background:var(--panel);padding:6px 12px 12px}
.maplist h3{margin:8px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #20262f;cursor:pointer}
.mrow .wk{flex:0 0 46px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.mrow .wk small{display:block;font-size:9.5px;color:var(--dim);font-weight:500}
.mrow .bd{flex:1;min-width:0}
.mrow .bd b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .bd span{font-size:11.5px;color:var(--dim)}
.mrow .st{font-size:11px;font-weight:700;white-space:nowrap}
.st.live{color:var(--now)}.st.soon{color:var(--star)}
@keyframes pulse{0%{r:9;opacity:.9}100%{r:26;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-40}}
.route{animation:dash 1s linear infinite}

/* guided tour */
.tourbtn{background:linear-gradient(135deg,#ff4d5e,#ff8a5c);border:0;color:#fff;font-weight:700;padding:6px 12px}
.spot{position:fixed;z-index:40;border-radius:12px;pointer-events:none;box-shadow:0 0 0 9999px rgba(5,7,12,.72),0 0 0 2px var(--now),0 0 24px rgba(255,77,94,.6);transition:all .45s cubic-bezier(.2,.8,.2,1)}
.spot.none{left:50%!important;top:50%!important;width:0!important;height:0!important;box-shadow:0 0 0 9999px rgba(5,7,12,.82)}
.cap{position:fixed;left:12px;right:12px;z-index:42;background:rgba(18,22,30,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:top .35s,bottom .35s}
.cap .ttl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--now);font-weight:700;margin-bottom:4px}
.cap .txt{font-size:16px;line-height:1.38;font-weight:600}
.cap .ctl{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:10px}
.cap .dots{display:flex;gap:4px}.cap .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.cap .dots i.on{background:var(--now)}
.cap .btn{padding:5px 10px;font-size:13px}
.tcard{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.tcard .box{pointer-events:auto;max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.tcard h1{margin:4px 0 8px;font-size:28px;letter-spacing:-.02em}.tcard h1 span{color:var(--now)}
.tcard p{color:#c9d0dc;margin:6px 0 14px}
.mess{position:fixed;inset:0;z-index:41;overflow:hidden;pointer-events:none;background:#0b0d12}
.mess .pdf{position:absolute;inset:6% 4% 22%;background:#f3f1ea;color:#222;border-radius:6px;padding:10px;transform:rotate(-2deg);box-shadow:0 20px 50px rgba(0,0,0,.6);font:9px/1.25 Georgia,serif;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;animation:drift 9s ease-in-out infinite alternate}
.mess .pdf div{border:1px solid #c9c4b5;padding:2px;overflow:hidden;height:46px}
.mess .q{position:absolute;font-weight:900;color:var(--now);text-shadow:0 4px 20px rgba(0,0,0,.6);animation:pop 1.6s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotate(1.5deg) scale(1.06) translate(-10px,8px)}}
@keyframes pop{from{transform:scale(.85);opacity:.6}to{transform:scale(1.1);opacity:1}}
.scan{position:fixed;inset:0;z-index:41;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.9);pointer-events:none}
.scan .ph{position:relative;width:260px;height:340px;border-radius:26px;border:3px solid #3a4252;overflow:hidden;background:#000}
.scan .ph img{width:100%;height:100%;object-fit:cover;opacity:.92}
.scan .ph .ln{position:absolute;left:8%;right:8%;height:3px;background:var(--now);box-shadow:0 0 14px var(--now);animation:sweep 1.4s ease-in-out infinite alternate}
.scan .ph .ok{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;color:#111;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .3s}
@keyframes sweep{from{top:18%}to{top:78%}}
</style>
</head>
<body>
<header>
  <div class="brand">Now<span>Line</span></div>
  <div class="conf" id="confName"></div>
  <button class="btn tourbtn" id="tourBtn">▶ Tour</button>
  <div class="clock" id="clock">--:--</div>
</header>

<div class="strip" id="strip"></div>

<div class="controls">
  <div class="viewsw"><button id="vTl" class="on">Timeline</button><button id="vMap">Map</button></div>
  <div class="sel" id="daySelWrap" style="display:none"><small>Day</small><select id="daySel"></select></div>
  <button class="btn live on" id="liveBtn">● Live</button>
  <button class="btn" id="demoBtn" title="Fast-forward time 60×">▶ 60×</button>
  <button class="btn icon" id="backBtn" title="Back 30 min">−30m</button>
  <button class="btn icon" id="fwdBtn" title="Forward 30 min">+30m</button>
  <div class="sel"><small>I'm at</small><select id="hereSel"></select></div>
  <div class="sel"><small>Show</small><select id="radiusSel">
    <option value="all">Everything</option>
    <option value="5">≤ 5 min walk</option>
    <option value="10">≤ 10 min walk</option>
    <option value="same">This building</option>
  </select></div>
  <button class="btn" id="addBlockBtn">+ Block</button>
  <button class="btn" id="starBtn">★ Mine</button>
  <button class="btn" id="lanesBtn">Rooms…</button>
  <button class="btn icon" id="zoomOut">−</button>
  <button class="btn icon" id="zoomIn">+</button>
  <button class="btn" id="signsBtn">Room signs…</button>
  <button class="btn" id="importBtn">Load schedule…</button>
</div>

<div class="tl" id="tl"><div class="inner" id="inner"></div></div>
<div class="mapwrap" id="mapWrap">
  <div class="mapbox" id="mapBox"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="maphint" id="mapHint"></div>
    <div class="mapctl"><button class="btn" id="mzIn">+</button><button class="btn" id="mzOut">−</button><button class="btn" id="mzMe" title="Center on me">◎</button></div>
  </div>
  <div class="maplist" id="mapList"></div>
</div>
<button class="follow" id="followBtn">⦿ Jump to now</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>//---------------------------------------------------------------------

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];

    var _moduleCount = 0;

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

<script>
/* ============================================================
   NowLine — proof of concept
   One file, no build step, no backend. Data is normalized to:
   { name, buildings:{id:{name,color,walk:{id:min}}},
     venues:[{id,name,building}],
     sessions:[{id,title,start,end,venue,track,speakers,desc}] }
   ============================================================ */

const MIN = 60000, HOUR = 60*MIN;
const PALETTE = ['#7cc4ff','#b48cff','#5fd39b','#ffb066','#ff7fb0','#6fe0e0','#d8d36a','#a0a8ff'];
const store = {
  get(k,d){try{const v=localStorage.getItem('nowline:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nowline:'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- demo data, generated around the current time so the line is always on content ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demoData(){
  const r = rng(42);
  const now = Date.now();
  const d0 = new Date(now); d0.setMinutes(0,0,0);
  const start = d0.getTime() - 3*HOUR;     // 3h of history
  const end   = start + 11*HOUR;           // ~8h ahead
  const buildings = {
    main:  {name:'Main Hall',   color:'#7cc4ff', walk:{main:1, annex:7, expo:3, hotel:12}},
    annex: {name:'Annex (across st.)', color:'#b48cff', walk:{main:7, annex:1, expo:6, hotel:9}},
    expo:  {name:'Expo Floor',  color:'#5fd39b', walk:{main:3, annex:6, expo:1, hotel:13}},
    hotel: {name:'Partner Hotel', color:'#ffb066', walk:{main:12, annex:9, expo:13, hotel:1}},
  };
  const venues = [
    {id:'key', name:'Keynote Stage', building:'main', where:'Ground floor, through the center doors'},
    {id:'r201',name:'Room 201',      building:'main', where:'2nd floor east wing: up the escalator, turn left'},

function hm(str){const [h,m]=String(str).split(':').map(Number);return (h*60+(m||0))*MIN}
function normalize(j){

    j.rooms.forEach(r=>room(String(r.id),r.name));

    });
  } else if (Array.isArray(j) && j[0] && Array.isArray(j[0].rooms)){  // Sessionize "Schedule grid"
    j.forEach(day=>day.rooms.forEach(r=>{ room(String(r.id),r.name);
      (r.sessions||[]).forEach(s=>sessions.push({id:String(s.id),title:s.title,start:new Date(s.startsAt).getTime(),
        end:new Date(s.endsAt).getTime(),venue:String(r.id),track:'',speakers:(s.speakers||[]).map(x=>x.name||x),desc:s.description||''}));
    }));
  } else {                                                            // simple format
    const list = Array.isArray(j) ? j : (j.sessions||[]);
    if (j && j.name) name=j.name;
    const bmap = {};
    (j.venues||[]).forEach(v=>{ room(v.id||v.name, v.name, v.building); if(v.where) rooms.get(v.id||v.name).where=v.where; });
    list.forEach((s,i)=>{

}
function finish(name,venues,sessions,buildings){

/* ---------- personal agenda: blocks + starred sessions, and walk-time conflicts ---------- */
function walkBetween(a,b){
  if(!a||!b) return null; if(a===b) return 0;
  const A=venueById(a),B=venueById(b); if(!A||!B) return null;
  const w=(data.buildings[A.building]||{}).walk||{};
  return w[B.building] ?? (A.building===B.building?1:8);
}
function myAgenda(){
  return S.blocks.map(b=>({kind:'block',id:b.id,title:b.title,start:b.start,end:b.end,venue:b.venue,place:b.place}))
    .concat(data.sessions.filter(s=>S.stars.has(s.id)).map(s=>({kind:'session',id:s.id,title:s.title,start:s.start,end:s.end,venue:s.venue})))
    .sort((a,b)=>a.start-b.start||a.end-b.end);
}
function agendaIssues(items){
  const out=[];
  for(let i=0;i<items.length;i++){
    const a=items[i];
    for(let j=i+1;j<items.length && items[j].start<a.end;j++){            // overlaps
      const b=items[j]; out.push({type:'overlap',a,b,at:b.start,until:Math.min(a.end,b.end)});
    }
    // the next thing you'd walk to after `a` ends
    const nextStart=items.filter(x=>x!==a && x.start>=a.end).reduce((m,x)=>Math.min(m,x.start),Infinity);
    if(!isFinite(nextStart)) continue;
    items.filter(x=>x!==a && x.start===nextStart).forEach(b=>{
      const w=walkBetween(a.venue,b.venue); if(w==null||w===0) return;
      const gap=Math.round((b.start-a.end)/MIN);
      out.push({type:'walk',a,b,walk:w,gap,late:Math.max(0,w-gap),bad:w>gap,at:a.end});
    });
  }
  return out;
}

function renderMeLane(W){

  h+=`<div class="track" data-venue="${esc(S.here||'')}" data-me="1" style="width:${W}px;background-size:${30*S.ppm}px 100%">`;

    if(it.kind==='block'){
      h+=`<div class="b" data-block="${esc(it.id)}" data-st="${it.start}" data-en="${it.end}" style="left:${l}px;width:${wd}px;top:${top}px;height:${ht}px"><div class="prog"></div><div class="t">👤 ${esc(it.title)}</div>${n<3?`<div class="m">${fmt(it.start)}–${fmt(it.end)} · ${esc(placeLabel(it))}</div>`:''}</div>`;
    } else {
      const v=venueById(it.venue);
      h+=`<div class="s" data-id="${esc(it.id)}" data-st="${it.start}" data-en="${it.end}" style="left:${l}px;width:${wd}px;top:${top}px;height:${ht}px;bottom:auto;--c:${v.color}"><div class="prog"></div><div class="t" style="-webkit-line-clamp:1">${esc(it.title)}</div>${n<3?`<div class="m">${esc(v.name)}</div>`:''}</div>`;

  }
  $('followBtn').classList.toggle('show',!S.follow && inSpan);
  if(force || Date.now()-lastStrip>5000 || (S.speed>1 && Date.now()-lastStrip>400)){renderStrip(); if(VIEW==='map') renderMap(); lastStrip=Date.now();}
}

/* ---------- NOW / NEXT strip ---------- */
function renderStrip(){
  const t=now();
  const vis=new Set(visibleVenues().filter(v=>inRange(v.id)).map(v=>v.id));
  const pool=data.sessions.filter(s=>vis.has(s.venue) && (!S.starOnly||S.stars.has(s.id)));
  const live=pool.filter(s=>s.start<=t&&s.end>t).sort((a,b)=>(walkMin(a.venue)??0)-(walkMin(b.venue)??0));
  const next=pool.filter(s=>s.start>t&&s.start-t<=45*MIN).sort((a,b)=>a.start-b.start);
  const card=(s,kind)=>{
    const v=venueById(s.venue), w=walkMin(s.venue);
    let k, extra='';
    if(kind==='now'){ k=`<span><b>● Now</b></span><span>${relLabel(s.end-t)} left</span>`;
      extra=`<div class="bar"><i style="width:${(t-s.start)/(s.end-s.start)*100}%"></i></div>`; }
    else { const inMin=Math.round((s.start-t)/MIN); k=`<span>Next · in ${inMin} min</span><span>${fmt(s.start)}</span>`;
      if(w!=null && S.here!==s.venue){ const leave=inMin-w; extra=`<div class="go">${leave<=0?'🏃 Leave now ('+w+' min walk)':'Leave in '+leave+' min · '+w+' min walk'}</div>`; } }
    return `<div class="card" data-id="${esc(s.id)}" style="--c:${v.color}"><div class="k">${k}</div><div class="t">${S.stars.has(s.id)?'★ ':''}${esc(s.title)}</div><div class="m">${esc(v.name)}${w!=null&&S.here!==s.venue?' · '+w+' min away':''}</div>${extra}</div>`;
  };
  // your own blocks: now + next 90 min
  const bcard=b=>{
    const isNow=b.start<=t&&b.end>t, w=walkMin(b.venue), inMin=Math.round((b.start-t)/MIN);
    let k=isNow?`<span><b>● Now</b> · yours</span><span>${relLabel(b.end-t)} left</span>`:`<span>Yours · in ${inMin} min</span><span>${fmt(b.start)}</span>`;
    let extra=isNow?`<div class="bar"><i style="width:${(t-b.start)/(b.end-b.start)*100}%"></i></div>`:
      (w!=null&&w>0?`<div class="go">${inMin-w<=0?'🏃 Leave now ('+w+' min walk)':'Leave in '+(inMin-w)+' min · '+w+' min walk'}</div>`:'');
    return `<div class="card mine" data-block="${esc(b.id)}"><div class="k">${k}</div><div class="t">👤 ${esc(b.title)}</div><div class="m">${esc(placeLabel(b))}</div>${extra}</div>`;
  };
  const myNow=S.blocks.filter(b=>b.end>t&&b.start-t<=90*MIN).sort((a,b)=>a.start-b.start);
  // upcoming conflicts in the next 4 hours go first: they're the actionable thing
  const warn=agendaIssues(myAgenda()).filter(c=>(c.type==='overlap'||c.bad)&&c.b.start>t-5*MIN&&c.at-t<4*HOUR).map(c=>{
    const ref=c.b.kind==='block'?`data-block="${esc(c.b.id)}"`:`data-id="${esc(c.b.id)}"`;
    return `<div class="card warn" ${ref}><div class="k"><span>⚠ ${c.type==='overlap'?'Overlap':'Tight connection'}</span><span>${fmt(c.type==='overlap'?c.at:c.b.start)}</span></div><div class="m" style="color:#ffc7cc">${esc(issueText(c))}</div></div>`;
  });
  let h=warn.join('')+myNow.filter(b=>b.start<=t).map(bcard).join('')+live.map(s=>card(s,'now')).join('')+myNow.filter(b=>b.start>t).map(bcard).join('')+next.map(s=>card(s,'next')).join('');
  if(!h) h=`<div class="empty">${t>SP.end?'Schedule has ended — use −30m or “Load schedule…” to try another.':
    t<SP.start?'Starts '+fmt(SP.start)+'.':'Nothing on right now'+(S.radius!=='all'&&S.here?' within your range':'')+'.'}</div>`;
  $('strip').innerHTML=h;
}

/* ---------- calendar import (.ics) ---------- */
function icsDate(v){
  const m=String(v).match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/); if(!m||!m[4]) return null; // skip all-day
  const a=[+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];
  return m[7]?Date.UTC(...a):new Date(...a).getTime();   // floating/TZID times read as this device's zone
}
function icsDur(v){const m=String(v).match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/);return m?((+m[1]||0)*24*60+(+m[2]||0)*60+(+m[3]||0))*MIN:0;}
const icsUnesc=s=>s.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1');
function zonedToUtc(a,tz){            // a = [y, month0, d, h, mi, s] as wall-clock time in IANA zone tz
  const base=Date.UTC(...a);
  try{
    const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    let g=base;
    for(let i=0;i<3;i++){
      const p=Object.fromEntries(f.formatToParts(new Date(g)).map(x=>[x.type,x.value]));
      const seen=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute,+p.second);
      const diff=base-seen; if(!diff) break; g+=diff;
    }
    return g;
  }catch(e){ return new Date(...a).getTime(); }   // unknown zone name (e.g. Windows names): read as device-local
}
function icsTime(val,params){
  const m=String(val).trim().match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?$/); if(!m||!m[4]) return null;
  const a=[+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];
  if(m[7]) return Date.UTC(...a);
  const tz=(params.match(/TZID=("?)([^";:]+)\1/i)||[])[2];
  return tz?zonedToUtc(a,tz):new Date(...a).getTime();
}
const icsText=v=>v.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1').trim();
function parseICSEvents(text){
  const lines=String(text).replace(/\r?\n[ \t]/g,'').split(/\r?\n/), evs=[]; let cur=null, cal={}, depth=0;
  for(const L of lines){
    if(/^BEGIN:VEVENT$/i.test(L)){cur={};continue;}
    if(/^END:VEVENT$/i.test(L)){ if(cur&&cur.start){ if(!cur.end&&cur.dur) cur.end=cur.start+cur.dur; if(cur.end>cur.start) evs.push(cur);} cur=null; continue; }
    if(/^BEGIN:(VTIMEZONE|VALARM|STANDARD|DAYLIGHT)$/i.test(L)){depth++;continue;}
    if(/^END:(VTIMEZONE|VALARM|STANDARD|DAYLIGHT)$/i.test(L)){depth--;continue;}
    if(depth>0) continue;
    const i=L.search(/:(?=(?:[^"]*"[^"]*")*[^"]*$)/); if(i<0) continue;
    const key=L.slice(0,i), val=L.slice(i+1), name=key.split(';')[0].toUpperCase(), params=key.slice(name.length);
    if(!cur){ if(name==='X-WR-CALNAME') cal.name=icsText(val); if(name==='X-WR-TIMEZONE') cal.tz=val.trim(); continue; }
    if(name==='SUMMARY') cur.title=icsText(val);
    else if(name==='LOCATION') cur.loc=icsText(val);
    else if(name==='DESCRIPTION') cur.notes=icsText(val);
    else if(name==='CATEGORIES') cur.cats=icsText(val);
    else if(name==='URL') cur.url=val.trim();
    else if(name==='UID') cur.uid=val.trim();
    else if(name==='DTSTART') cur.start=icsTime(val, params||(cal.tz?';TZID='+cal.tz:''));
    else if(name==='DTEND') cur.end=icsTime(val, params||(cal.tz?';TZID='+cal.tz:''));
    else if(name==='DURATION') cur.dur=icsDur(val);
  }
  evs.cal=cal; return evs;
}
// Sched titles often end with " - Speaker Name, Company"
function splitTitle(t){
  const i=t.lastIndexOf(' - '); if(i<8) return {title:t,speakers:[]};
  const tail=t.slice(i+3);
  if(tail.split(/\s+/).length<=16 && /,/.test(tail)) return {title:t.slice(0,i).trim(),speakers:tail.split(/\s*(?:&|;|\band\b)\s*/).map(x=>x.trim()).filter(Boolean)};

// A whole-event calendar feed (Sched “iCal”, Swapcard/Cvent exports…) → a schedule: LOCATION becomes the room lane
function scheduleFromICS(text,fallbackName){
  const evs=parseICSEvents(text); if(!evs.length) throw new Error('No timed events found in that calendar.');
  const seen=new Set(), rooms=new Map(), sessions=[];
  const levelOf=loc=>{const m=loc.match(/\(([^)]*\b(level|floor|lvl|ground|mezzanine|mezz|hall|building|tower|wing)\b[^)]*)\)/i)||loc.match(/\b(level\s*\w+|floor\s*\w+|\w+\s+floor)\b/i);return m?m[1].trim():null;};
  evs.forEach((e,i)=>{
    const id=e.uid||('ics'+i); if(seen.has(id)) return; seen.add(id);
    const loc=(e.loc||'').trim()||'Room TBA';
    if(!rooms.has(loc)){ const lv=levelOf(loc); rooms.set(loc,{id:loc,name:loc,building:lv||'venue',where:lv||''}); }
    const tt=splitTitle(e.title||'Untitled');
    sessions.push({id,title:tt.title,speakers:tt.speakers,start:e.start,end:e.end,venue:loc,track:(e.cats||'').split(',')[0].trim(),desc:e.notes||'',url:e.url||''});
  });
  const venues=[...rooms.values()].sort((a,b)=>a.building.localeCompare(b.building,undefined,{numeric:true})||a.name.localeCompare(b.name,undefined,{numeric:true}));
  const bids=[...new Set(venues.map(v=>v.building))], buildings={};
  bids.forEach((b,i)=>buildings[b]={name:b==='venue'?'Venue':b,color:PALETTE[i%PALETTE.length],walk:{}});
  bids.forEach(a=>bids.forEach(b=>buildings[a].walk[b]= a===b?1:3));   // floors of one venue: ~3 min by escalator (edit in config)
  return finish(evs.cal.name||fallbackName||'Imported calendar',venues,sessions,buildings);
}
function parseICS(text){
  return parseICSEvents(text).map(e=>({title:e.title,loc:e.loc,notes:(e.notes||'').slice(0,400),uid:e.uid,start:e.start,end:e.end}));
}
function parseICS_legacy(text){
  const lines=text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/), evs=[]; let cur=null;
  for(const L of lines){
    if(L==='BEGIN:VEVENT') cur={};
    else if(L==='END:VEVENT'){ if(cur&&cur.start){ if(!cur.end&&cur.dur) cur.end=cur.start+cur.dur; if(cur.end>cur.start) evs.push(cur);} cur=null; }
    else if(cur){ const i=L.indexOf(':'); if(i<0) continue; const name=L.slice(0,i).split(';')[0], val=L.slice(i+1);
      if(name==='SUMMARY') cur.title=icsUnesc(val); else if(name==='LOCATION') cur.loc=icsUnesc(val);
      else if(name==='DESCRIPTION') cur.notes=icsUnesc(val).slice(0,400); else if(name==='UID') cur.uid=val;
      else if(name==='DTSTART') cur.start=icsDate(val); else if(name==='DTEND') cur.end=icsDate(val); else if(name==='DURATION') cur.dur=icsDur(val); }
  }
  return evs;
}
function matchVenue(loc){
  if(!loc) return null; const L=loc.toLowerCase();
  const v=data.venues.find(v=>L.includes(v.name.toLowerCase()))||data.venues.find(v=>v.name.toLowerCase().includes(L));
  return v?v.id:null;
}

function directions(fromId,toId,startAt){
  const A=venueById(fromId), B=venueById(toId); if(!B) return '';
  if(A && A.id===B.id) return `<div class="okbox">You're already here.</div>`;
  const w=walkBetween(fromId,toId), steps=[];
  if(A && A.building!==B.building){
    const r=(data.routes||{})[A.building+'>'+B.building];
    steps.push(r||`Head to ${esc((data.buildings[B.building]||{}).name||B.building)}.`);
  } else if(A){ steps.push(`Stay in ${esc((data.buildings[A.building]||{}).name||'this building')}.`); }
  steps.push(`<b>${esc(B.name)}</b>: ${esc(B.where||'follow the room signs')}.`);
  let timing='';
  if(startAt && w!=null){
    const t=now(), leaveIn=Math.round((startAt-t)/MIN)-w;
    timing = startAt<=t ? `<div class="warnbox">Already started. Go now (${w} min walk).</div>`

      : `<div class="okbox">${w} min walk · leave by ${fmt(startAt-w*MIN)} (${leaveIn} min from now).</div>`;
  } else if(w!=null) timing=`<div class="note">${w} min walk</div>`;
  return timing+`<ol style="margin:8px 0 0;padding-left:20px;color:#c9d0dc">${steps.map(x=>`<li style="margin:4px 0">${x}</li>`).join('')}</ol>`;
}

  bids.forEach(b=>{

function fitRoute(a,b){

  let w=x1-x0,h=y1-y0,ar=boxAspect(); if(h/w>ar) w=h/ar; else h=w*ar;
  MV={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h}; renderMap();
}
// pan / pinch / wheel on the map
(function(){
  const box=$('mapBox'), pts=new Map(); let last=null, moved=0;
  const toUnits=dx=>dx*MV.w/box.clientWidth;
  box.addEventListener('pointerdown',e=>{if(e.target.closest('.mapctl,.maphint'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});box.setPointerCapture(e.pointerId);moved=0;last=null;});
  box.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)||!MV) return; const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;moved+=Math.abs(dx)+Math.abs(dy);MV.x-=toUnits(dx);MV.y-=toUnits(dy);renderMap();}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(last){zoomAt(last/d,(a.x+b.x)/2,(a.y+b.y)/2);}last=d;moved+=10;}
  });
  const up=e=>{pts.delete(e.pointerId);last=null;};
  box.addEventListener('pointerup',e=>{
    const wasTap=moved<8&&pts.size===1; up(e);
    if(wasTap){const g=document.elementFromPoint(e.clientX,e.clientY);const r=g&&g.closest&&g.closest('[data-room]');if(r) openRoom(r.dataset.room);}
  });
  box.addEventListener('pointercancel',up);
  box.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:0.87,e.clientX,e.clientY);},{passive:false});
  function zoomAt(f,cx,cy){
    const r=box.getBoundingClientRect(), px=MV.x+(cx-r.left)/r.width*MV.w, py=MV.y+(cy-r.top)/r.height*MV.h;
    const nw=Math.min(Math.max(MV.w*f,180),data.site.w*1.6), nh=nw*boxAspect();
    MV={x:px-(px-MV.x)*nw/MV.w,y:py-(py-MV.y)*nh/MV.h,w:nw,h:nh}; renderMap();
  }
  $('mzIn').onclick=()=>{const r=box.getBoundingClientRect();zoomAt(0.75,r.left+r.width/2,r.top+r.height/2);};
  $('mzOut').onclick=()=>{const r=box.getBoundingClientRect();zoomAt(1.33,r.left+r.width/2,r.top+r.height/2);};
  $('mzMe').onclick=()=>{mapRoute=null;renderMap(true);};
})();

function pickVoice(){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));
    const pref=['Samantha','Ava','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Daniel','Google UK English Female'];
    T.voice=pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean)||vs.find(v=>/en-US/i.test(v.lang))||vs[0]||null;}catch(e){}

function playClip(i){
  return new Promise(res=>{
    const est=Math.max(2600,TOUR[i].say.split(/\s+/).length*390+600);
    let done=false; const fin=()=>{if(done)return;done=true;clearTimeout(T.timer);res(true);};
    try{
      if(!T.audio) T.audio=new Audio();
      const a=T.audio; a.onended=fin; a.onerror=()=>{done=true;clearTimeout(T.timer);res(false);};
      a.src=TOUR_AUDIO[i]; T.fin=fin;
      T.timer=setTimeout(fin,est*2+3000);
      const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{if(!done){done=true;clearTimeout(T.timer);res(false);}});
    }catch(e){res(false);}
  });
}
async function speakStep(i){
  if(!T.muted && typeof TOUR_AUDIO!=='undefined' && TOUR_AUDIO[i]){ if(await playClip(i)) return; }
  return speak(TOUR[i].say);
}
function speak(text){
  return new Promise(res=>{
    const est=Math.max(2600,text.split(/\s+/).length*390+600);
    let done=false; const fin=()=>{if(done)return;done=true;clearTimeout(T.timer);res();};
    if(T.muted||!('speechSynthesis' in window)){T.timer=setTimeout(fin,est);T.fin=fin;return;}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); u.rate=1.02; if(T.voice){u.voice=T.voice;u.lang=T.voice.lang;}
      u.onend=fin; u.onerror=fin; T.fin=fin;
      T.timer=setTimeout(fin,est*2+2000);      // safety net if the browser never fires onend
      speechSynthesis.speak(u);
    }catch(e){T.timer=setTimeout(fin,est);T.fin=fin;}
  });
}
function tourLayer(){

  // caption goes wherever there's more room
  if(top>vh-bot){cap.style.bottom='';cap.style.top='calc(12px + env(safe-area-inset-top))';}
  else{cap.style.top='';cap.style.bottom='calc(18px + env(safe-area-inset-bottom))';}

async function runFrom(i){
  const my=++T.token;
  for(T.i=i;T.i<TOUR.length;T.i++){
    const st=TOUR[T.i];
    if(S.speed!==1||Math.abs(now()-Date.now())>MIN) setClock(Date.now(),1);   // every step starts at real time
    if(st.view!=='map' && VIEW==='map'){ mapRoute=null; setView('timeline'); }
    if(st.before) await st.before();
    if(my!==T.token) return;
    setScene(st.scene);
    renderCap(st);
    const follow=()=>{placeSpot(st.target?st.target():null,st.pad);T.raf=setTimeout(follow,300);};
    clearTimeout(T.raf); follow();
    await speakStep(T.i);
    if(my!==T.token) return;
    await sleep(st.scene==='end'?0:500);
    if(st.after) await st.after();
    if(my!==T.token) return;

  }

  const parseAny=txt=>{ const t=txt.replace(/^\uFEFF/,'').trim(); return /^BEGIN:VCALENDAR/i.test(t)?scheduleFromICS(t):normalize(JSON.parse(t)); };
  const preview=()=>{ try{ const d=parseAny($('imp').value); const days=new Set(d.sessions.map(s=>dayKey(s.start))).size;
      $('impInfo').textContent=`Looks good: ${d.sessions.length} sessions in ${d.venues.length} rooms over ${days} day${days>1?'s':''}${d.name?' · '+d.name:''}.`; $('impErr').textContent=''; }
    catch(e){ $('impInfo').textContent=''; if($('imp').value.trim()) $('impErr').textContent='Not readable yet: '+e.message; } };
  $('imp').oninput=preview;
  $('impFile').onchange=e=>{const f=e.target.files[0]; if(!f) return; f.text().then(t=>{$('imp').value=t;preview();});};
  $('impFetch').onclick=async()=>{
    const u=$('impUrl').value.trim(), r=$('impRelay').value.trim(); store.set('impUrl',u); store.set('impRelay',r);
    if(!/^https:\/\//.test(u)){ $('impErr').textContent='Enter an https:// link.'; return; }
    $('impErr').textContent=''; $('impInfo').textContent='Fetching…';
    try{ const res=await fetch(r? r+encodeURIComponent(u) : u); if(!res.ok) throw new Error('HTTP '+res.status); $('imp').value=await res.text(); preview(); }
    catch(e){ $('impInfo').textContent=''; $('impErr').textContent='Could not fetch it here ('+e.message+'). Download the file and choose it above, or set a relay URL on a self-hosted copy.'; }
  };
  $('doImp').onclick=()=>{
    try{
      let d=parseAny($('imp').value);
      if($('rebase').checked) d=rebaseToToday(d);
      data=d; store.set('data',d); S.hidden.clear(); store.set('hidden',[]); boot(); closeSheet();
    }catch(e){$('impErr').textContent='Could not read that: '+e.message;}
  };
}

/* ---------- boot ---------- */
function boot(){
  S.here=store.get('here:'+data.name,null); if(S.here&&!venueById(S.here)) S.here=null;
  S.follow=true; S.anchorReal=Date.now(); S.anchorVirt=Date.now(); S.speed=1;
  S.dayAuto=true; pickDay(true);
  S.blocks=store.get(blockKey(),null);
  if(!S.blocks){ S.blocks=[]; if(data.name.startsWith('Demo')) seedDemoAgenda(); }
  renderAll();
}
// first run on the demo: a client meeting on the expo floor that runs too close to a workshop across the street
function seedDemoAgenda(){
  const t=Date.now();
  const ws=data.sessions.filter(s=>(s.venue==='wa'||s.venue==='wb')&&s.start>=t+60*MIN).sort((a,b)=>a.start-b.start)[0];
  const st=ws?ws.start-48*MIN:Math.ceil(t/(15*MIN))*15*MIN+30*MIN;
  S.blocks=[{id:'demo1',title:'Coffee with Acme (client)',start:st,end:st+45*MIN,venue:'hall',place:'Coffee bar',notes:'Demo block. Edit or delete me.'}];
  if(ws){S.stars.add(ws.id);saveStars();}
  saveBlocks();
}
data = store.get('data',null) || demoData();
if(data.name.startsWith('Demo')) data=demoData();  // always regenerate demo around today
boot();
handleHash();
if(location.hash==='#tour' || !store.get('seenTour',false)){ store.set('seenTour',true); tourIntro(); }
setInterval(()=>tick(), 250);
window.addEventListener('resize',()=>tick());
</script>
