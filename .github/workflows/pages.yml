name: Deploy to GitHub Pages

# Publishes the static app (index.html, src/, vendor/, assets/) to https://bnelford.github.io/nowline/,
# plus coverage and test-count badge endpoints (coverage-badge.json, tests-badge.json; scripts/badges.js).
# Pages must be enabled in the repo settings with "Source: GitHub Actions" for the deploy job to run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; don't cancel one that's already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests and badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage --reporter=default --reporter=json --outputFile.json=reports/unit.json
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list,json
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/e2e.json
      - run: node scripts/badges.js reports/badges
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badges
          path: reports/badges/
          retention-days: 1

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # copies only the files the site loads (see SITE_FILES in scripts/site.js); no dependencies needed
      - run: node scripts/site.js _site
      # the badge JSON written by the test job, served at the site root
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: badges
          path: _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
